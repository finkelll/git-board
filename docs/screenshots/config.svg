<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="git-board config panel screenshot">
  <rect width="1280" height="360" fill="#14191d"/>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 20px; }
    .cyan { fill: #21c8d4; font-weight: 700; }
    .label { fill: #ffff4d; font-weight: 700; }
    .value { fill: #f2f2f2; font-weight: 700; }
    .hint { fill: #6e7279; }
    .footer { fill: #7d8188; }
  </style>

  <text x="610" y="34" class="cyan">Config</text>

  <text x="24" y="82" class="label">interval</text>
  <rect x="170" y="57" width="520" height="32" fill="#64676c"/>
  <text x="170" y="82" class="value">15s</text>
  <text x="740" y="82" class="hint">Left/Right or -/+ adjusts by 1s</text>

  <text x="24" y="120" class="label">limit</text>
  <text x="170" y="120" class="value">20</text>
  <text x="740" y="120" class="hint">Left/Right or -/+ adjusts by 1</text>

  <text x="24" y="158" class="label">cursor</text>
  <text x="170" y="158" class="value">auto-hide enabled</text>
  <text x="740" y="158" class="hint">Left/Right toggles</text>

  <text x="24" y="196" class="label">hide after</text>
  <text x="170" y="196" class="value">5s</text>
  <text x="740" y="196" class="hint">Left/Right or -/+ adjusts by 1s</text>

  <text x="24" y="234" class="label">columns</text>
  <text x="170" y="234" class="value">workflow,branch,event,id,elapsed,age</text>
  <rect x="580" y="209" width="14" height="32" fill="#d6d600"/>
  <text x="740" y="234" class="hint">type to edit, Left/Right moves cursor</text>

  <text x="24" y="315" class="footer">Up/Down selects  Left/Right or -/+ edit  q/Esc cancel  Enter accept</text>
</svg>
